name: Portal checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json
      - run: npm ci --prefix Backend
      - run: npm ci --prefix Frontend
      - run: npm run build --prefix Frontend
      - name: Install disposable MongoDB binary
        run: |
          container=$(docker create mongo:8.0-noble)
          docker cp "$container:/usr/bin/mongod" "$RUNNER_TEMP/mongod"
          docker rm "$container"
          echo "MONGOD_BIN=$RUNNER_TEMP/mongod" >> "$GITHUB_ENV"
      - run: npm --prefix Backend test
